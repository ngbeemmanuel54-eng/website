<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>display properties</title>
        <style>
            div{
                background-color: blue; 
                width: 100px;
                height: 50px;
            }
            h1{
                background-color: red;
                width: 100px;
                height: 50px;
                display: inline;
            }
        </style>
</head>
<body>
    <div></div>
</body>
</html>
